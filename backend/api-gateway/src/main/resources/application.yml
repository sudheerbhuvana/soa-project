server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: carrier-service
          uri: lb://carrier-service
          predicates:
            - Path=/api/carriers/**
          filters:
            - StripPrefix=2
            - JwtAuthenticationFilter
        - id: container-service
          uri: lb://container-service
          predicates:
            - Path=/api/containers/**
          filters:
            - StripPrefix=2
            - JwtAuthenticationFilter
        - id: yard-service
          uri: lb://yard-service
          predicates:
            - Path=/api/yard/**
          filters:
            - StripPrefix=2
            - JwtAuthenticationFilter
        - id: gate-service
          uri: lb://gate-service
          predicates:
            - Path=/api/gate/**
          filters:
            - StripPrefix=2
            - JwtAuthenticationFilter
      loadbalancer:
        retry:
          enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: harborflow-super-secret-key-for-jwt-signing-2026-port-ops
